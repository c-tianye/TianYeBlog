name: deploy-digest

on:
  push:
    branches: [main]
    paths:
      - "worker/digest/**"
      - ".github/workflows/deploy-digest.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Typecheck, test and deploy the digest worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck worker
        working-directory: worker/digest
        run: pnpm run typecheck

      - name: Test worker
        working-directory: worker/digest
        run: pnpm test

      - name: Deploy to Cloudflare Workers
        working-directory: worker/digest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
